# Reference R environment of the submission: R 4.5.3 with Bioconductor 3.22 (conda-forge + bioconda).
#   conda env create -f environment-r.yml && conda activate tfp-r && Rscript R/install_deps.R
# R/install_deps.R then installs, from inside R, the two data packages that are not on conda:
#   - MotrpacRatTraining6moData 2.0.0, pinned to GitHub commit f831a4fe421ec11687640452484a8247137aa74a (tag v2.1.0);
#   - bodymapRat (ExperimentHub; CC BY 4.0): Bioconductor serves one version per release, 1.26.0 under 3.22 and
#     1.28.0 under 3.23 (the version documented for the reference export); the data behind both are the same.
# edgeR 4.8.2, limma 3.66.0 and arrow 25.0.0 were present in the reference environment but no R script here needs them.
name: tfp-r
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.5.3
  - r-data.table=1.18.6.1
  - r-jsonlite=2.0.0
  - r-remotes=2.5.0
  - r-biocmanager=1.30.27
  - bioconductor-summarizedexperiment=1.40.0
  - bioconductor-experimenthub  # 3.0.0 is the Bioconductor 3.22 build on bioconda
