name: Tests that need no raw data
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # leakage, I/O, conformal, batch-nesting and site-provenance tests; the results/-dependent tests skip themselves
      - run: PYTHONPATH=src python -m pytest -q
      - run: python tools/linkcheck.py
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # the browser's conformal port against the Python-computed fixtures committed in site/data
      - run: node tests/test_site_conformal.js
