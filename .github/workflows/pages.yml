name: Publish site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    # Publish only from the personal repository, whose Pages site is the live one. The team repository
    # (Stanford-Bioinformatics-Center/multiomics-hackathon-2026-track-3) does not have Pages enabled yet, so the job
    # would fail there on every push; remove this line once Pages is enabled on the team repository.
    if: github.repository == 'CoryGardner/motrpac_challenge'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
