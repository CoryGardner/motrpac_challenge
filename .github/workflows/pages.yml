name: Publish site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    # Publishes from both repositories: the team repository (Stanford-Bioinformatics-Center/multiomics-hackathon-2026-track-3,
    # a private Pages site for organization members) and the public mirror (CoryGardner/motrpac_challenge). Both have
    # Pages enabled with source "GitHub Actions"; the site uses relative links only, so it works under either root.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
