[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tfp-tissue-fingerprint-pipeline"
version = "2.1.2"
description = "Calibrated, leakage-safe evaluation of MoTrPAC multi-omic tissue fingerprints"
requires-python = ">=3.10"
license = {text = "MIT"}
# The Rat PAC, in no particular order
authors = [
  {name = "Samuel Montalvo"},
  {name = "Manasa Rapuru"},
  {name = "Erol Evangelista"},
  {name = "Cory Gardner"},
]
# Lower bounds only. The exact versions of the reference run are pinned in requirements.txt and environment.yml.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
# import-guarded: umap-learn (EDA embeddings), pyarrow (parquet caching), statsmodels (variance partition, mixed
# models), seaborn (a few figures), nbformat (the notebooks under extras/)
extras = ["umap-learn", "pyarrow", "statsmodels", "seaborn", "nbformat"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Stanford-Bioinformatics-Center/multiomics-hackathon-2026-track-3"
Repository = "https://github.com/Stanford-Bioinformatics-Center/multiomics-hackathon-2026-track-3.git"
Site = "https://turbo-guide-2yve4kz.pages.github.io/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
