[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motrpac-hackathon-starter"
version = "0.1.0"
description = "Calibrated, leakage-safe evaluation of MoTrPAC multi-omic tissue fingerprints"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
extras = ["umap-learn", "pyarrow", "statsmodels", "seaborn", "jupyter", "mapie"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
